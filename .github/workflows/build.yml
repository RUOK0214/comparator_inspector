name: Build and Release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: comparator-inspector
          path: build/libs/*.jar
          if-no-files-found: error
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - run: chmod +x gradlew
      - run: xvfb-run -a ./gradlew runClientGameTest --no-daemon
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [build, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: comparator-inspector
          path: build/libs
      - name: Package the verified build
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          test -n "$version"
          jar="comparator-inspector-${version}.jar"
          package="Comparator-Inspector-${version}-MC26.2"
          mkdir -p "dist/$package"
          cp "build/libs/$jar" "dist/$package/"
          cp "build/libs/$jar" dist/
          cp README.md LICENSE RELEASE_NOTES.md "dist/$package/"
          (cd dist && zip -r "comparator-inspector-${version}-mc26.2.zip" "$package")
          (cd dist && sha256sum "$jar" "comparator-inspector-${version}-mc26.2.zip" > SHA256SUMS.txt)
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "true" ]; then
              echo "::error::An unfinished draft already exists for $tag. Review it before retrying."
              exit 1
            fi
            echo "Release $tag already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft \
            --title "Comparator Inspector $RELEASE_VERSION · Minecraft 26.2 / Fabric" \
            --notes-file RELEASE_NOTES.md \
            "dist/comparator-inspector-${RELEASE_VERSION}.jar" \
            "dist/comparator-inspector-${RELEASE_VERSION}-mc26.2.zip" dist/SHA256SUMS.txt
          gh release edit "$tag" --draft=false --latest
